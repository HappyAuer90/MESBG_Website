<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MESBG-Tool für Profile, Regeln und Armee-Listen">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light dark">
    <title>MESBG Online Tool</title>

    <!-- Global -->
    <link rel="stylesheet" href="css/theme.css">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/settings.css">

    <!-- Views -->
    <link rel="stylesheet" href="css/profiles-search.css">
    <link rel="stylesheet" href="css/profiles-expert.css">
    <link rel="stylesheet" href="css/profiles-all.css">
    
    <link rel="stylesheet" href="css/rules-manual.css">    
    <link rel="stylesheet" href="css/rules-all.css">

    <link rel="stylesheet" href="css/armylists-search.css">
    <link rel="stylesheet" href="css/armylists-all.css">
    <link rel="stylesheet" href="css/armylists-build.css">
</head>
<body>

<header id="mainHeader">
    <h1 class="title" id="appTitle"></h1>

    <div class="header-line"></div>

    <div class="header-nav-shell">
        <div class="header-controls">
            <div class="header-nav-buttons">
                <button id="globalBackBtn" class="nav-btn" data-i18n-key="accessibility.goBack" data-i18n-attr="aria-label" aria-label="">←</button>
                <button id="globalForwardBtn" class="nav-btn" data-i18n-key="accessibility.goForward" data-i18n-attr="aria-label" aria-label="">→</button>
            </div>
            <button id="languageToggleBtn" class="lang-btn" aria-label="" title="">🇩🇪</button>
            <button id="settingsBtn" class="settings-btn" data-i18n-key="accessibility.openSettings" data-i18n-attr="aria-label" aria-label="">⚙</button>
        </div>

        <nav id="mainCategories"></nav>
        <nav id="subCategories"></nav>
    </div>
</header>

<main id="content"></main>

<noscript>
    <p data-i18n-key="accessibility.noScript"></p>
</noscript>

<div id="settingsModal" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
